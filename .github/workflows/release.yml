name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  classify-release:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - name: Validate and classify release tag
        id: classify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          core_identifier='(0|[1-9][0-9]*)'
          prerelease_identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          build_identifier='[0-9A-Za-z-]+'
          tag_pattern="^v${core_identifier}\.${core_identifier}\.${core_identifier}(-${prerelease_identifier}(\.${prerelease_identifier})*)?(\+${build_identifier}(\.${build_identifier})*)?$"
          if [[ ! "$RELEASE_TAG" =~ $tag_pattern ]]; then
            echo "Invalid semantic release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version_without_build="${RELEASE_TAG%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Broker cross-builds ────────────────────────────────────────────────
  #
  # The wolfpack-broker is a rust binary that owns every PTY session in
  # production. It must ship in each platform npm package + each gh release
  # asset. We split the build across two runners so each target builds with
  # the cleanest available toolchain:
  #
  #   - macOS targets: native rustup target add on a darwin-arm64 runner.
  #     `cargo build --target x86_64-apple-darwin` works without docker or
  #     extra linkers because Apple's clang ships both arches.
  #
  #   - Linux targets: `cross` (https://github.com/cross-rs/cross). It
  #     uses per-target docker images preconfigured with the right glibc /
  #     gcc-cross / linker, which avoids the apt-get-gcc-aarch64-linux-gnu
  #     dance and produces consistent binaries regardless of the runner's
  #     base image.
  #
  # Both jobs publish their broker binaries as artifacts named after the
  # bun-target the main `build` job uses (`broker-bun-<plat>-<arch>`).

  broker-darwin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
        with:
          toolchain: 1.89.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Setup pinned Zig
        run: scripts/setup-zig-0.16.0.sh

      - name: Prebuild pinned libghostty-vt archives
        run: bun run scripts/build-ghostty-vt.ts --target aarch64-apple-darwin --target x86_64-apple-darwin

      # `--locked` ensures release builds use the exact dependency versions
      # in Cargo.lock; if the lockfile is stale CI fails loudly instead of
      # picking up a newer dep at tag-push time.
      - name: Build broker (darwin-arm64)
        run: cargo build --release --locked --manifest-path broker/Cargo.toml --target aarch64-apple-darwin --bin wolfpack-broker

      - name: Build broker (darwin-x64)
        run: cargo build --release --locked --manifest-path broker/Cargo.toml --target x86_64-apple-darwin --bin wolfpack-broker

      - name: Stage broker binaries
        run: |
          mkdir -p staging/bun-darwin-arm64 staging/bun-darwin-x64
          cp broker/target/aarch64-apple-darwin/release/wolfpack-broker staging/bun-darwin-arm64/
          cp broker/target/x86_64-apple-darwin/release/wolfpack-broker staging/bun-darwin-x64/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broker-bun-darwin-arm64
          path: staging/bun-darwin-arm64/wolfpack-broker
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broker-bun-darwin-x64
          path: staging/bun-darwin-x64/wolfpack-broker
          if-no-files-found: error

  broker-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
        with:
          toolchain: 1.89.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Setup pinned Zig
        run: scripts/setup-zig-0.16.0.sh

      - name: Prebuild pinned libghostty-vt archives
        run: bun run scripts/build-ghostty-vt.ts --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu

      - name: Install cross
        # Pin to a known version so a future `cross` release that breaks
        # something doesn't surprise us at tag-push time.
        run: cargo install cross --version 0.2.5 --locked

      # `--locked` for the same reason as the darwin job above. cross is
      # a thin wrapper around cargo, so it passes the flag through.
      - name: Build broker (linux-x64)
        run: cross build --release --locked --manifest-path broker/Cargo.toml --target x86_64-unknown-linux-gnu --bin wolfpack-broker

      - name: Build broker (linux-arm64)
        run: cross build --release --locked --manifest-path broker/Cargo.toml --target aarch64-unknown-linux-gnu --bin wolfpack-broker

      - name: Stage broker binaries
        run: |
          mkdir -p staging/bun-linux-x64 staging/bun-linux-arm64
          cp broker/target/x86_64-unknown-linux-gnu/release/wolfpack-broker staging/bun-linux-x64/
          cp broker/target/aarch64-unknown-linux-gnu/release/wolfpack-broker staging/bun-linux-arm64/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broker-bun-linux-x64
          path: staging/bun-linux-x64/wolfpack-broker
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broker-bun-linux-arm64
          path: staging/bun-linux-arm64/wolfpack-broker
          if-no-files-found: error

  # ── Main build / package ───────────────────────────────────────────────
  build:
    needs: [broker-darwin, broker-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download broker artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Each artifact lands at dist/broker/<name>/wolfpack-broker, which
          # matches the layout scripts/build.ts looks for. The artifact names
          # already start with "broker-" so we strip that prefix via pattern.
          path: dist/broker
          pattern: broker-*
          merge-multiple: false

      - name: Normalize broker artifact layout
        # actions/download-artifact lays them out as
        # `dist/broker/broker-bun-<target>/wolfpack-broker`. Strip the
        # "broker-" prefix so they match scripts/build.ts's expected
        # `dist/broker/bun-<target>/wolfpack-broker`.
        run: |
          set -e
          cd dist/broker
          for d in broker-*; do
            [ -d "$d" ] || continue
            mv "$d" "${d#broker-}"
          done
          ls -la
          chmod +x bun-*/wolfpack-broker

      - name: Build all targets
        run: bun run scripts/build.ts

      - name: Generate checksums
        working-directory: dist
        run: |
          # Include both the bun-compiled wolfpack binaries and the
          # rust-compiled broker binaries so users verifying a download
          # have one canonical sha256 list per release. Enumerate the
          # exact set we upload so we don't accidentally include
          # dist/wolfpack-broker (the host-arch staging copy used by
          # deploy-local.sh, not a release asset).
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            cp "broker/bun-${target}/wolfpack-broker" "wolfpack-broker-${target}"
          done
          sha256sum \
            wolfpack-linux-x64 wolfpack-linux-arm64 \
            wolfpack-darwin-x64 wolfpack-darwin-arm64 \
            wolfpack-broker-linux-x64 wolfpack-broker-linux-arm64 \
            wolfpack-broker-darwin-x64 wolfpack-broker-darwin-arm64 \
            THIRD_PARTY_NOTICES \
            > checksums-sha256.txt

      - name: Smoke installed package and native release artifacts
        run: bun run scripts/smoke-release-artifacts.ts linux-x64

      # package.json may be version-synchronized by scripts/build.ts. Ship the
      # exact built manifest with dist so the isolated npm job publishes what
      # this build produced rather than regenerating package metadata.
      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle-${{ github.sha }}
          path: |
            dist
            package.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, classify-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle-${{ github.sha }}
          path: .

      - name: Attest release binaries
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/wolfpack-linux-x64
            dist/wolfpack-linux-arm64
            dist/wolfpack-darwin-x64
            dist/wolfpack-darwin-arm64
            dist/wolfpack-broker-linux-x64
            dist/wolfpack-broker-linux-arm64
            dist/wolfpack-broker-darwin-x64
            dist/wolfpack-broker-darwin-arm64
            dist/THIRD_PARTY_NOTICES
            dist/checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.classify-release.outputs.prerelease }}
          files: |
            dist/wolfpack-linux-x64
            dist/wolfpack-linux-arm64
            dist/wolfpack-darwin-x64
            dist/wolfpack-darwin-arm64
            dist/wolfpack-broker-linux-x64
            dist/wolfpack-broker-linux-arm64
            dist/wolfpack-broker-darwin-x64
            dist/wolfpack-broker-darwin-arm64
            dist/THIRD_PARTY_NOTICES
            dist/checksums-sha256.txt

  publish-npm:
    if: ${{ needs.classify-release.outputs.prerelease == 'false' }}
    needs: [build, classify-release, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.0
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle-${{ github.sha }}
          path: .

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run scripts/publish.ts
