name: Tests

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain (for wolfpack-broker)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      # `--locked` makes cargo refuse to build when Cargo.lock would need
      # updating, catching a stale lockfile (forgotten `cargo update`,
      # hand-edited Cargo.toml without lock refresh, etc.) instead of
      # silently drifting at build time. CI is the only place we enforce
      # this; `bun run scripts/build.ts` in dev mode stays unlocked so
      # local rebuilds Just Work.
      - name: Build wolfpack-broker (required by integration + e2e tests)
        run: cargo build --release --locked --manifest-path broker/Cargo.toml --bin wolfpack-broker

      - name: Run broker tests
        run: cargo test --locked --manifest-path broker/Cargo.toml --all

      - name: Audit dependencies
        run: |
          npm i --package-lock-only --ignore-scripts 2>/dev/null
          npm audit --audit-level=high
          rm -f package-lock.json

      - name: Generate embedded assets
        run: bun run scripts/gen-assets.ts

      - name: Check public-assets.ts is in sync with public/
        run: git diff --exit-code src/public-assets.ts public/wolfpack-lib.js

      - name: Typecheck (root + public/)
        run: bun run typecheck

      - name: Run tests
        run: bun test tests/unit/ tests/snapshot/ tests/integration/api.test.ts tests/integration/ralph-api.test.ts tests/integration/ralph-aggregation.test.ts tests/integration/ws-dispatch.test.ts tests/integration/pty-takeover.test.ts tests/integration/prompt-reconnect.test.ts

      - name: Run auth tests (isolated — sets JWT env vars that contaminate shared module cache)
        run: bun test tests/integration/auth-middleware.test.ts
