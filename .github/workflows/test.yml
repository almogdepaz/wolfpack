name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test tests/unit/validation.test.ts tests/unit/plan-parsing.test.ts tests/unit/plan-mutation.test.ts tests/unit/ralph-log.test.ts tests/unit/config.test.ts tests/snapshot/ tests/integration/
