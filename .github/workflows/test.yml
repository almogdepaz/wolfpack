name: Tests

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install Rust toolchain (for wolfpack-broker)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
        with:
          toolchain: 1.89.0

      - name: Cache cargo registry and broker target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            broker/target
          key: cargo-test-${{ runner.os }}-rust-1.89.0-${{ hashFiles('broker/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-rust-1.89.0-

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate agent context links
        run: bun run check:context

      - name: Setup pinned Zig
        run: scripts/setup-zig-0.16.0.sh

      - name: Build verified libghostty-vt archive (linux-x64)
        run: bun run scripts/build-ghostty-vt.ts --target x86_64-unknown-linux-gnu

      # `--locked` makes cargo refuse to build when Cargo.lock would need
      # updating, catching a stale lockfile (forgotten `cargo update`,
      # hand-edited Cargo.toml without lock refresh, etc.) instead of
      # silently drifting at build time. CI is the only place we enforce
      # this; `WOLFPACK_BUILD_MODE=local bun run scripts/build.ts` stays unlocked so
      # local rebuilds Just Work.
      - name: Build wolfpack-broker (required by integration + e2e tests)
        run: cargo build --release --locked --manifest-path broker/Cargo.toml --bin wolfpack-broker

      - name: Run broker tests
        run: cargo test --locked --manifest-path broker/Cargo.toml --all

      - name: Audit dependencies
        run: |
          npm i --package-lock-only --ignore-scripts 2>/dev/null
          npm audit --audit-level=high
          rm -f package-lock.json

      - name: Generate embedded assets
        run: bun run scripts/gen-assets.ts

      - name: Check generated public assets are in sync
        run: git diff --exit-code src/public-assets.ts

      - name: Typecheck (root + public/)
        run: bun run typecheck

      - name: Run all unit and snapshot tests
        run: bun test tests/unit/ tests/snapshot/

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-webkit
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-

      - name: Install critical Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Run every integration test except auth in one explicit shard
        run: |
          mapfile -d '' files < <(find tests/integration -name '*.test.ts' ! -name 'auth-middleware.test.ts' -print0 | sort -z)
          test "${#files[@]}" -gt 0
          bun test "${files[@]}"

      - name: Run auth tests (isolated — sets JWT env vars that contaminate shared module cache)
        run: bun test tests/integration/auth-middleware.test.ts

      - name: Enforce browser bundle budgets
        run: bun run check:bundle-budgets

      - name: Run homepage quality and resilience QA
        id: homepage-qa
        run: bunx playwright test tests/e2e/homepage-install.e2e.ts --project=desktop --project=iphone-se --project=iphone-14

      - name: Upload homepage QA diagnostics
        # Keep the extraction branch's no-artifact-on-applicability-skip behavior
        # while taking main's v7 action pin.
        if: always() && steps.homepage-qa.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homepage-quality-diagnostics
          path: artifacts/homepage-quality
          if-no-files-found: error

      - name: Run critical Chromium desktop and mobile E2E
        run: bunx playwright test tests/e2e/accessibility-navigation.e2e.ts tests/e2e/axe-accessibility.e2e.ts tests/e2e/smoke.e2e.ts tests/e2e/terminal.e2e.ts tests/e2e/reconnect.e2e.ts --project=desktop --project=iphone-se

      - name: Run critical mobile WebKit E2E shard
        run: bunx playwright test --project=mobile-webkit

      - name: Enforce desktop terminal-load budgets
        env:
          WOLFPACK_PERF_RUNS: "3"
          WOLFPACK_PERF_DEVICE: desktop
          WOLFPACK_PERF_ENFORCE_BUDGETS: "1"
        run: bun run perf:terminal-load

      - name: Enforce mobile terminal-load budgets
        env:
          WOLFPACK_PERF_RUNS: "3"
          WOLFPACK_PERF_DEVICE: mobile
          WOLFPACK_PERF_ENFORCE_BUDGETS: "1"
        run: bun run perf:terminal-load

  ghostty-vt-behavior:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
        with:
          toolchain: 1.89.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Cache cargo registry and broker target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            broker/target
          key: cargo-ghostty-vt-${{ runner.os }}-rust-1.89.0-${{ hashFiles('broker/Cargo.lock') }}
          restore-keys: |
            cargo-ghostty-vt-${{ runner.os }}-rust-1.89.0-

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Setup pinned Zig
        run: scripts/setup-zig-0.16.0.sh

      - name: Build verified libghostty-vt archive (linux-x64)
        run: bun run scripts/build-ghostty-vt.ts --target x86_64-unknown-linux-gnu

      - name: Build authoritative Ghostty broker binary
        run: cargo build --release --locked --manifest-path broker/Cargo.toml --bin wolfpack-broker

      - name: Run real broker snapshot hydration/reflow integration
        env:
          WOLFPACK_BROKER_BIN: ${{ github.workspace }}/broker/target/release/wolfpack-broker
        run: bun test tests/integration/broker-snapshot-reflow.test.ts
